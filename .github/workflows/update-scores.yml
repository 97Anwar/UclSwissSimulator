name: Update real UCL results

on:
  schedule:
    # --- BEGIN MATCHDAY SCHEDULE ---
    # Automatically generated by scripts/update-match-schedule.mjs
    # Covers 16 matchdays across 5 months

    # 1) Matchday evening windows (19:15, 21:15, 22:15, 23:15 UTC)
    - cron: '15 19,21,22,23 8,9,10 9 *' # Sep 8, 9, 10 (2026)
    - cron: '15 19,21,22,23 13,14,20,21 10 *' # Oct 13, 14, 20, 21 (2026)
    - cron: '15 19,21,22,23 3,4,24,25 11 *' # Nov 3, 4, 24, 25 (2026)
    - cron: '15 19,21,22,23 8,9 12 *' # Dec 8, 9 (2026)
    - cron: '15 19,21,22,23 19,20,27 1 *' # Jan 19, 20, 27 (2027)

    # 2) Morning-after confirmation runs (06:00 UTC)
    - cron: '0 6 9,10,11 9 *' # Sep 9, 10, 11 (2026)
    - cron: '0 6 14,15,21,22 10 *' # Oct 14, 15, 21, 22 (2026)
    - cron: '0 6 4,5,25,26 11 *' # Nov 4, 5, 25, 26 (2026)
    - cron: '0 6 9,10 12 *' # Dec 9, 10 (2026)
    - cron: '0 6 20,21,28 1 *' # Jan 20, 21, 28 (2027)

    # 3) Weekly safety check & GitHub Actions inactivity heartbeat (every Monday at 06:00 UTC)
    - cron: '0 6 * * 1'
    # --- END MATCHDAY SCHEDULE ---
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/fetch-results.mjs --force
          else
            node scripts/fetch-results.mjs
          fi

      - name: Generate matchday/team pages from latest data
        run: node scripts/generate-static-pages.mjs

      - name: Commit updated data and pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/real-results.json matchday-*.html teams/ sitemap.xml
          git add assets/logos guide 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update real UCL results, matchday/team pages [automated]"
          git pull --rebase origin main
          git push
